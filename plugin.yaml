name: jev-skill-router
version: 0.1.0
description: >-
  Names the one skill from your live roster that fits the turn, before the model call —
  typed routing via TypeSafe Jev on the Vercel AI Gateway. Says nothing when nothing fits.
  Stdlib only.
author: Patrick (DoGMaTiiC)
license: MIT
homepage: https://github.com/DoGMaTiiC/hermes-jev-skill-router
requires_hermes: ">=0.21"
kind: standalone
tags: [routing, skills, hooks, jev, typesafe, vercel]
provides_tools: []
provides_hooks:
  - pre_llm_call
provides_middleware: []
requires_env:
  - name: AI_GATEWAY_API_KEY
    description: "Vercel AI Gateway key — typesafe-ai/jev runs on the gateway's free monthly credit."
    url: "https://vercel.com/dashboard"
    secret: true
config_schema:
  mode:
    type: str
    default: "off"
    description: "off | auto (route when the key is present) | on"
  gate:
    type: float
    default: 0.30
    description: "Mean of the three request judgments; below it nothing is suggested"
  fits:
    type: float
    default: 0.40
    description: "Winner's own 'does it fit' judgment; below it nothing is suggested"
  shortlist:
    type: int
    default: 3
  chunk:
    type: int
    default: 240
    description: "Skills per Choice question (API caps one Choice at 255 options)"
  excerpt:
    type: int
    default: 700
    description: "SKILL.md characters each shortlisted candidate brings"
  timeout_s:
    type: float
    default: 4.0
    description: "Wall-clock budget per Jev call (fail-open on timeout)"
  suggest_chars:
    type: int
    default: 4000
    description: "Longer user messages are left alone"
  jev_model:
    type: str
    default: "typesafe-ai/jev"
  jev_base_url:
    type: str
    default: "https://ai-gateway.vercel.sh/v4/ai"
  roster_dir:
    type: str
    default: ""
    description: "Default: <HERMES_HOME>/skills"
  log_path:
    type: str
    default: ""
    description: "Default: <HERMES_HOME>/logs/jev-skill-router.log"
